
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f;--bg2:#080d18;--bg3:#0b1220;--bg4:#060b15;
  --border:#0f2035;--border2:#162840;--border3:#1e3a58;
  --gold:#c8a84b;--red:#e85050;--blue:#1a7fe0;--green:#5ec97a;--orange:#e8914a;
  --text:#c8dff0;--text2:#4a7fa8;--text3:#1e3a58;
  --mono:'Share Tech Mono',monospace;--sans:'Rajdhani',sans-serif;
  --inc:#19a0e8;--bjp:#f47920;--bjp-bg:rgba(244,121,32,0.1);--inc-bg:rgba(25,160,232,0.1);
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:600px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(26,127,224,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,127,224,0.03) 1px,transparent 1px);
  background-size:40px 40px;}

.page-wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* TOP HEADER */
.top-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
  border-bottom:1px solid var(--border);background:var(--bg2)}
.logo{font-family:var(--mono);font-size:12px;color:#4a9fd4;letter-spacing:.14em}
.logo span{color:var(--gold)}
.const-tabs{display:flex;gap:6px}
.ctab{padding:6px 14px;border:1px solid var(--border2);border-radius:2px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;cursor:pointer;
  color:var(--text3);background:transparent;transition:all .2s}
.ctab.active{background:var(--gold);color:#0a0800;border-color:var(--gold)}

/* YEAR SCRUBBER */
.scrubber-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px}
.scrub-label{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.12em;margin-bottom:10px}
.scrub-track{position:relative;height:36px;display:flex;align-items:center}
.scrub-line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border2);transform:translateY(-50%)}
.scrub-fill{position:absolute;left:0;top:50%;height:2px;background:var(--gold);transform:translateY(-50%);transition:width .3s ease;border-radius:1px}
.year-markers{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center}
.ym{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.ym-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg);
  transition:all .2s;position:relative;z-index:1}
.ym.election .ym-dot{border-color:var(--gold);background:var(--bg)}
.ym.active .ym-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(200,168,75,0.5)}
.ym-year{font-family:var(--mono);font-size:8px;color:var(--text3);margin-top:4px;letter-spacing:.05em;transition:color .2s}
.ym.active .ym-year,.ym:hover .ym-year{color:var(--gold)}
.ym.election .ym-year{color:var(--text2)}
.election-badge{position:absolute;top:-16px;font-family:var(--mono);font-size:7px;color:var(--gold);
  letter-spacing:.06em;white-space:nowrap}
input[type=range].scrub-input{position:absolute;left:0;right:0;width:100%;opacity:0;cursor:pointer;height:36px;z-index:10}

/* SPLIT VIEW */
.split{display:grid;grid-template-columns:1fr 1fr;min-height:480px;gap:0}
.panel{padding:20px;border-right:1px solid var(--border)}
.panel:last-child{border-right:none}
.panel-tag{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.14em;margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.panel-tag::after{content:'';flex:1;height:1px;background:var(--border)}

/* CONSTITUENCY PANEL */
.const-name{font-size:22px;font-weight:700;color:#f0e8cc;letter-spacing:-0.3px;margin-bottom:2px}
.const-meta{font-family:var(--mono);font-size:9px;color:var(--text2);margin-bottom:16px}
.year-display{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:16px;
  padding:6px 10px;border:1px solid rgba(200,168,75,0.3);border-radius:2px;display:inline-block}

.fund-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.fund-chip{background:var(--bg3);border:1px solid var(--border);border-radius:2px;padding:10px 12px}
.fund-chip .fc-label{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.08em;margin-bottom:4px}
.fund-chip .fc-val{font-size:17px;font-weight:700;color:#f0e8cc;line-height:1}
.fund-chip .fc-val.gold{color:var(--gold)}
.fund-chip .fc-val.red{color:var(--red)}
.fund-chip .fc-val.green{color:var(--green)}

.util-bar-wrap{margin-bottom:16px}
.util-label{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.08em;
  display:flex;justify-content:space-between;margin-bottom:6px}
.util-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.util-fill{height:100%;border-radius:3px;transition:width .5s ease;background:var(--green)}
.util-fill.warn{background:var(--orange)}
.util-fill.bad{background:var(--red)}

.spend-breakdown{margin-bottom:16px}
.sb-title{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.1em;margin-bottom:8px}
.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sb-row-label{font-size:11px;color:var(--text2);min-width:90px;font-family:var(--mono)}
.sb-row-bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px}
.sb-row-bar{height:100%;border-radius:2px;transition:width .4s ease}
.sb-row-val{font-family:var(--mono);font-size:9px;color:var(--text);min-width:40px;text-align:right}

.left-badge{display:inline-block;font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:2px;margin-bottom:12px}
.left-badge.warn{background:rgba(232,80,80,0.1);color:var(--red);border:1px solid rgba(232,80,80,0.2)}
.left-badge.ok{background:rgba(94,201,122,0.1);color:var(--green);border:1px solid rgba(94,201,122,0.2)}

/* MP PANEL */
.mp-transition{transition:opacity .3s ease}
.mp-transition.fade{opacity:0}

.mp-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.mp-avatar{width:48px;height:48px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;flex-shrink:0;letter-spacing:-1px}
.mp-avatar.inc{background:rgba(25,160,232,0.15);color:var(--inc);border:1px solid rgba(25,160,232,0.3)}
.mp-avatar.bjp{background:rgba(244,121,32,0.15);color:var(--bjp);border:1px solid rgba(244,121,32,0.3)}
.mp-name{font-size:20px;font-weight:700;color:#f0e8cc;line-height:1;margin-bottom:3px}
.mp-party-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;
  padding:3px 8px;border-radius:2px;letter-spacing:.06em}
.mp-party-badge.inc{background:var(--inc-bg);color:var(--inc);border:1px solid rgba(25,160,232,0.2)}
.mp-party-badge.bjp{background:var(--bjp-bg);color:var(--bjp);border:1px solid rgba(244,121,32,0.2)}
.mp-party-badge.dec{background:rgba(100,100,100,0.1);color:#888;border:1px solid rgba(100,100,100,0.2)}
.mp-meta-row{font-family:var(--mono);font-size:9px;color:var(--text2);margin-top:4px}

.mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.mps-chip{background:var(--bg3);border:1px solid var(--border);border-radius:2px;padding:8px 10px;text-align:center}
.mps-chip .mv{font-size:15px;font-weight:700;line-height:1;color:#f0e8cc}
.mps-chip .mv.green{color:var(--green)}
.mps-chip .mv.red{color:var(--red)}
.mps-chip .mv.blue{color:var(--blue)}
.mps-chip .ml{font-family:var(--mono);font-size:7px;color:var(--text3);margin-top:3px;letter-spacing:.05em}

.mp-section-title{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.12em;
  margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}

/* TIMELINE */
.timeline{position:relative;padding-left:16px}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--border2)}
.tl-item{position:relative;margin-bottom:10px}
.tl-dot{position:absolute;left:-14px;top:4px;width:7px;height:7px;border-radius:50%;
  border:1.5px solid var(--border2);background:var(--bg);transition:all .2s}
.tl-dot.gold{border-color:var(--gold);background:var(--gold)}
.tl-dot.blue{border-color:var(--blue)}
.tl-dot.bjp{border-color:var(--bjp)}
.tl-dot.inc{border-color:var(--inc)}
.tl-year{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.06em}
.tl-text{font-size:12px;color:var(--text);line-height:1.4;margin-top:1px}
.tl-text strong{color:#f0e8cc;font-weight:600}

/* WIN MARGIN TAG */
.margin-tag{display:inline-block;font-family:var(--mono);font-size:8px;padding:2px 6px;
  border-radius:2px;margin-left:6px;vertical-align:middle}
.margin-tag.big{background:rgba(94,201,122,0.1);color:var(--green)}
.margin-tag.thin{background:rgba(232,80,80,0.1);color:var(--red)}

/* DECEASED BANNER */
.deceased-notice{background:rgba(100,80,50,0.15);border:1px solid rgba(200,168,75,0.2);
  border-radius:2px;padding:8px 10px;margin-bottom:12px;
  font-family:var(--mono);font-size:9px;color:#a08040;letter-spacing:.06em}

/* INCUMBENT TAG */
.incumbent-tag{display:inline-block;font-family:var(--mono);font-size:8px;padding:2px 7px;
  border-radius:2px;margin-left:8px;background:rgba(200,168,75,0.1);color:var(--gold);
  border:1px solid rgba(200,168,75,0.2);vertical-align:middle}

/* CONSTITUENCY HISTORY CHART */
.history-chart{margin-bottom:0}
.hc-title{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.1em;margin-bottom:10px}
.hc-bars{display:flex;gap:10px;align-items:flex-end;height:70px}
.hc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.hc-alloc{border-radius:2px 2px 0 0;transition:height .5s ease;min-height:4px}
.hc-util{border-radius:2px 2px 0 0;transition:height .5s ease;min-height:2px;margin-top:1px}
.hc-yr{font-family:var(--mono);font-size:7px;color:var(--text3);margin-top:4px}
.hc-legend{display:flex;gap:12px;margin-top:8px}
.hc-leg-item{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;color:var(--text3)}
.hc-leg-dot{width:8px;height:8px;border-radius:1px}

.no-mp-notice{background:var(--bg3);border:1px dashed var(--border2);border-radius:3px;
  padding:20px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3)}
</style>

<div class="page-wrap">

<div class="top-header">
  <div class="logo">NETA<span>CHECK</span> <span style="color:var(--text3);font-size:9px">// CONSTITUENCY TIMELINE</span></div>
  <div class="const-tabs">
    <button class="ctab active" onclick="switchConst('ambala', this)">AMBALA</button>
    <button class="ctab" onclick="switchConst('bhilwara', this)">BHILWARA</button>
  </div>
</div>

<div class="scrubber-bar">
  <div class="scrub-label">// YEAR SELECTOR — CLICK OR DRAG TO NAVIGATE</div>
  <div class="scrub-track" id="scrub-track">
    <div class="scrub-line"></div>
    <div class="scrub-fill" id="scrub-fill"></div>
    <div class="year-markers" id="year-markers"></div>
    <input type="range" class="scrub-input" id="year-input" min="0" step="1">
  </div>
</div>

<div class="split">
  <div class="panel" id="const-panel">
    <div class="panel-tag">// CONSTITUENCY DATA</div>
    <div id="const-content"></div>
  </div>
  <div class="panel" id="mp-panel">
    <div class="panel-tag">// MP DOSSIER</div>
    <div class="mp-transition" id="mp-content"></div>
  </div>
</div>

</div>

<script>
let DATA = {};
let MPs = {};

let currentConst = 'ambala';
let currentYearIdx = 10; // default = 2024

function switchConst(c, tabEl) {
  if (!DATA[c]) return;
  currentConst = c;
  document.querySelectorAll('.ctab').forEach(t => t.classList.remove('active'));
  if (tabEl) tabEl.classList.add('active');
  currentYearIdx = Math.max(0, DATA[currentConst].years.length - 1);
  buildScrubber();
  render();
}

function buildScrubber() {
  const d = DATA[currentConst];
  if (!d) return;
  const years = d.years;
  const input = document.getElementById('year-input');
  input.max = years.length - 1;
  input.value = currentYearIdx;

  const markers = document.getElementById('year-markers');
  markers.innerHTML = '';
  years.forEach((y, i) => {
    const isEl = d.electionYears.includes(y);
    const el = document.createElement('div');
    el.className = 'ym' + (isEl ? ' election' : '') + (i === currentYearIdx ? ' active' : '');
    el.innerHTML = (isEl ? `<div class="election-badge">ELECTION</div>` : '') +
      `<div class="ym-dot"></div><div class="ym-year">${y}</div>`;
    el.onclick = () => { currentYearIdx = i; input.value = i; render(); };
    markers.appendChild(el);
  });
  updateFill();
}

function updateFill() {
  if (!DATA[currentConst]) return;
  const years = DATA[currentConst].years;
  const pct = (currentYearIdx / (years.length - 1)) * 100;
  document.getElementById('scrub-fill').style.width = pct + '%';
  document.querySelectorAll('.ym').forEach((el, i) => {
    el.classList.toggle('active', i === currentYearIdx);
  });
}

document.getElementById('year-input').addEventListener('input', function() {
  currentYearIdx = parseInt(this.value);
  updateFill();
  render();
});

function utilColor(pct) {
  if (pct >= 85) return '';
  if (pct >= 65) return ' warn';
  return ' bad';
}

function projectBarColor(name) {
  const map = { 'Roads':'#4a7fa8', 'Water':'#1a7fe0', 'Schools':'#5ec97a', 'Health':'#e8914a' };
  return map[name] || '#888';
}

function renderConst() {
  const d = DATA[currentConst];
  if (!d) return;
  const year = d.years[currentYearIdx];
  const m = d.mplads[year];
  const utilPct = Math.round((m.util / m.alloc) * 100);
  const unspent = +(m.alloc - m.util).toFixed(1);
  const isElYear = d.electionYears.includes(year);

  // historical bar chart data (last 4 available)
  const histYears = d.years.filter(y => y <= year).slice(-4);

  let html = `
    <div class="const-name">${d.name} (PC)</div>
    <div class="const-meta">${d.state} · ${d.type} · ${d.totalVoters} voters</div>
    <div class="year-display">// ${year}${isElYear ? ' — ELECTION YEAR' : ''}</div>
  `;

  if (isElYear && d.turnout[year]) {
    html += `<div class="left-badge ok">TURNOUT: ${d.turnout[year]}%</div>`;
  }
  if (unspent > 1.5) {
    html += `<div class="left-badge warn">⚠ ₹${unspent}Cr UNSPENT THIS YEAR</div>`;
  }

  html += `<div class="fund-grid">
    <div class="fund-chip"><div class="fc-label">MPLADS ALLOCATED</div><div class="fc-val">₹${m.alloc}Cr</div></div>
    <div class="fund-chip"><div class="fc-label">UTILISED</div><div class="fc-val ${utilPct >= 85 ? 'green' : utilPct >= 65 ? 'gold' : 'red'}">₹${m.util}Cr</div></div>
  </div>
  <div class="util-bar-wrap">
    <div class="util-label"><span>UTILISATION</span><span>${utilPct}%</span></div>
    <div class="util-bar"><div class="util-fill${utilColor(utilPct)}" style="width:${utilPct}%"></div></div>
  </div>
  <div class="spend-breakdown">
    <div class="sb-title">// SPEND BREAKDOWN</div>
    ${m.projects.map(p => `
      <div class="sb-row">
        <div class="sb-row-label">${p.name}</div>
        <div class="sb-row-bar-wrap"><div class="sb-row-bar" style="width:${p.pct}%;background:${projectBarColor(p.name)}"></div></div>
        <div class="sb-row-val">${p.pct}%</div>
      </div>`).join('')}
  </div>
  <div class="history-chart">
    <div class="hc-title">// FUND UTILISATION HISTORY</div>
    <div class="hc-bars">`;

  histYears.forEach(hy => {
    const hm = d.mplads[hy];
    const hp = Math.round((hm.util / hm.alloc) * 100);
    const allocH = 60;
    const utilH = Math.round((hm.util / hm.alloc) * allocH);
    html += `<div class="hc-col">
      <div style="display:flex;flex-direction:column-reverse;flex:1;width:100%;gap:1px">
        <div class="hc-alloc" style="height:${allocH}px;background:var(--border2);width:100%"></div>
        <div class="hc-util" style="position:absolute;display:none"></div>
      </div>
    </div>`;
  });

  html += `</div></div>`;

  // rebuild bars properly
  html = html.replace(/<div class="hc-bars">[\s\S]*<\/div>\s*<\/div>$/, '');
  html += `<div class="hc-bars" id="hc-bars-inner">`;
  histYears.forEach(hy => {
    const hm = d.mplads[hy];
    const utilH = Math.round((hm.util / hm.alloc) * 60);
    const isActive = hy === year;
    html += `<div class="hc-col" style="position:relative">
      <div style="position:relative;width:100%;height:60px;background:var(--border);border-radius:2px;overflow:hidden;${isActive?'outline:1px solid var(--gold)':''}">
        <div style="position:absolute;bottom:0;left:0;right:0;height:${utilH}px;background:${utilH/60 >= 0.85 ? 'var(--green)' : utilH/60 >= 0.65 ? 'var(--gold)' : 'var(--red)'};border-radius:2px;transition:height .4s ease"></div>
      </div>
      <div class="hc-yr">${hy}</div>
    </div>`;
  });
  html += `</div>
  <div class="hc-legend">
    <div class="hc-leg-item"><div class="hc-leg-dot" style="background:var(--border)"></div>Allocated</div>
    <div class="hc-leg-item"><div class="hc-leg-dot" style="background:var(--green)"></div>Utilised</div>
  </div>`;

  document.getElementById('const-content').innerHTML = html;
}

function renderMP() {
  const d = DATA[currentConst];
  if (!d) return;
  const year = d.years[currentYearIdx];
  const mpKey = d.mpByYear[year];
  const mp = MPs[mpKey];
  const el = document.getElementById('mp-content');

  if (!mp) {
    el.innerHTML = `<div class="no-mp-notice">NO DATA FOR THIS PERIOD</div>`;
    return;
  }

  el.classList.add('fade');
  setTimeout(() => {
    let html = '';

    if (mp.note && mp.note.type === 'deceased') {
      html += `<div class="deceased-notice">${mp.note.text}</div>`;
    }

    html += `<div class="mp-header">
      <div class="mp-avatar ${mp.partyClass}">${mp.initials}</div>
      <div>
        <div class="mp-name">${mp.name}${mp.isIncumbent ? '<span class="incumbent-tag">INCUMBENT</span>' : ''}</div>
        <div class="mp-party-badge ${mp.partyClass}">${mp.party}</div>
        ${mp.extraBadge ? `<div class="mp-party-badge" style="margin-left:6px;display:inline-flex;background:rgba(200,168,75,0.1);color:var(--gold);border-color:rgba(200,168,75,0.2)">${mp.extraBadge}</div>` : ''}
        <div class="mp-meta-row">Born ${mp.born} · ${mp.profession}</div>
      </div>
    </div>`;

    html += `<div class="mp-stats">
      <div class="mps-chip"><div class="mv green">${mp.attendance}%</div><div class="ml">ATTENDANCE</div></div>
      <div class="mps-chip"><div class="mv blue">${mp.questions}</div><div class="ml">QUESTIONS</div></div>
      <div class="mps-chip"><div class="mv ${mp.cases > 0 ? 'red' : 'green'}">${mp.cases}</div><div class="ml">CASES</div></div>
    </div>`;

    html += `<div class="mp-section-title">// ${mp.election.year} ELECTION RESULT</div>
    <div class="fund-grid" style="margin-bottom:14px">
      <div class="fund-chip"><div class="fc-label">VOTES WON</div><div class="fc-val" style="font-size:14px">${mp.election.votes}</div></div>
      <div class="fund-chip"><div class="fc-label">MARGIN</div><div class="fc-val ${mp.election.marginClass === 'big' ? 'green' : 'gold'}" style="font-size:14px">${mp.election.margin}</div></div>
    </div>`;

    html += `<div class="mp-section-title">// CAREER TIMELINE</div>
    <div class="timeline">`;
    mp.timeline.forEach(t => {
      html += `<div class="tl-item">
        <div class="tl-dot ${t.dot}"></div>
        <div class="tl-year">${t.year}</div>
        <div class="tl-text">${t.text}</div>
      </div>`;
    });
    html += `</div>`;

    html += `<div style="margin-top:14px;font-family:var(--mono);font-size:8px;color:var(--text3)">
      EDUCATION: ${mp.edu}<br>DECLARED ASSETS: ${mp.assets}
    </div>`;

    el.innerHTML = html;
    el.classList.remove('fade');
  }, 200);
}

function render() {
  renderConst();
  renderMP();
}

async function init() {
  try {
    const [constRes, mpRes] = await Promise.all([
      fetch('constituency_timeline_data.json'),
      fetch('constituency_timeline_mps.json')
    ]);
    if (!constRes.ok) throw new Error('Failed to load constituency_timeline_data.json');
    if (!mpRes.ok) throw new Error('Failed to load constituency_timeline_mps.json');

    DATA = await constRes.json();
    MPs = await mpRes.json();

    const params = new URLSearchParams(window.location.search);
    const q = (params.get('constituency') || params.get('c') || '').trim().toLowerCase();
    currentConst = DATA[q] ? q : 'ambala';

    document.querySelectorAll('.ctab').forEach(btn => {
      const key = btn.textContent.trim().toLowerCase();
      btn.classList.toggle('active', key === currentConst);
    });

    currentYearIdx = Math.max(0, DATA[currentConst].years.length - 1);
    buildScrubber();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('const-content').innerHTML =
      `<div class="no-mp-notice">FAILED TO LOAD JSON DATA</div>`;
    document.getElementById('mp-content').innerHTML =
      `<div class="no-mp-notice">${err.message}</div>`;
  }
}

init();
</script>
